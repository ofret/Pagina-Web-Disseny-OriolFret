<!doctype html>
<html lang="ca">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Registra't a la pàgina web">
  <link rel="stylesheet" href="../css/output.css">
  <title>Register</title>
</head>

<body>

  <header>
    <a href="/index.html">
      <img class="logo" src="../img/logo.webp" alt="Logo de la lliga">
    </a>
  </header>

  <main class="contenidor-principal">
    <h1>CREAR COMPTE</h1>
    
    <aside class="contenidor-esquerra">
      <img class="img-login" src="../img/futbolista.webp" alt="Il·lustració d'un futbolista">
    </aside>

    <section class="contenidor-dreta">
      <form action="#" method="POST">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" required>

        <label for="contrasenya">Contrasenya</label>
        <input type="password" id="contrasenya" name="psw" required>

        <label for="c-contrasenya">Confirmar Contrasenya</label>
        <input type="password" id="c-contrasenya" name="c-psw" required>

        <button type="submit" class="btn-iniciar">Registra't</button>

        <nav class="links" aria-label="Navegació del formulari">
          <a href="/index.html">Tornar a l'inici</a>
        </nav>

      </form>
    </section>
  </main>

</body>

</html>
