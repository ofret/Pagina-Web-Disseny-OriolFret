<!doctype html>
<html lang="ca">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Registra't a la pàgina web">
  <link rel="stylesheet" href="../css/output.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Oswald:wght@600;700&display=swap"
    rel="stylesheet">
  <title>Register</title>
</head>

<body>

  <header>
    <a href="../index.html">
      <img src="../img/logo.webp" alt="Informació Futbol Actual - Inici" class="logo">
    </a>
  </header>

  <main class="contenidor-principal">
    <h1>CREAR COMPTE</h1>

    <aside class="contenidor-esquerra">
      <img class="img-register" src="../img/balon.webp" alt="Pilota de futbol a la gespa">
    </aside>

    <section class="contenidor-dreta">
      <form action="#" method="POST">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required>

        <label for="contrasenya">Contrasenya</label>
        <input type="password" id="contrasenya" name="psw" autocomplete="new-password" minlength="8"
          aria-describedby="ajuda-contrasenya" required>
        <small id="ajuda-contrasenya" class="text-ajuda">Ha de tenir un mínim de 8 caràcters</small>

        <label for="c-contrasenya">Confirmar Contrasenya</label>
        <input type="password" id="c-contrasenya" name="c-psw" autocomplete="new-password" minlength="8" required>

        <button type="submit" class="btn-iniciar">Registra't</button>

        <nav class="links" aria-label="Navegació del formulari">
          <a href="/html/login.html">Inicia sessió</a>
          <a href="/index.html">Tornar a l'inici</a>
        </nav>

        <img class="logo-dr" src="../img/logo.webp" alt="Logo secundari">
      </form>
    </section>
  </main>

</body>

</html>
