<!doctype html>
<html lang="ca">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Inicia Sessió a la pàgina web">
  <link rel="stylesheet" href="../css/output.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Oswald:wght@600;700&display=swap"
    rel="stylesheet">
  <title>Login</title>
</head>

<body>

  <header>
    <a href="../index.html">
      <img src="../img/logo.webp" alt="Informació Futbol Actual - Inici" class="logo">
    </a>
  </header>

  <main class="contenidor-principal">
    <h1>INICIAR SESSIÓ</h1>

    <aside class="contenidor-esquerra">
      <img class="img-login" src="../img/balon.webp" alt="Pilota de futbol a la gespa">
    </aside>

    <section class="contenidor-dreta">
      <form action="#" method="POST">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" name="email" autocomplete="email" required>

        <label for="login-password">Contrasenya</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required>

        <button type="submit" class="btn-iniciar">Iniciar Sessió</button>

        <nav class="links" aria-label="Navegació del formulari">
          <a href="/html/register.html">Crear compte</a>
          <a href="/index.html">Tornar a l'inici</a>
        </nav>

        <img class="logo-dr" src="../img/logo.webp" alt="Logo secundari">
      </form>
    </section>
  </main>

</body>

</html>
